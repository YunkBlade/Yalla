<title>Yalla | Relatórios de Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --navy:#0D1220;--navy2:#121a2c;--navy3:#18223a;--navy4:#22304f;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --y:#F2A314;--y-soft:rgba(242,163,20,.13);
  --txt:#EEF1F7;--muted:#8C95AB;--dim:#5d6780;
  --green:#2ED47A;--green-soft:rgba(46,212,122,.12);
  --red:#FF6363;--red-soft:rgba(255,99,99,.12);
  --amber:#FFC24B;--amber-soft:rgba(255,194,75,.13);
  --blue:#6EA8FE;--blue-soft:rgba(110,168,254,.13);
  --topbg:rgba(13,18,32,.93);--hover:rgba(255,255,255,.02);
}
[data-theme="dark"]{
  --navy:#0A0A0B;--navy2:#141416;--navy3:#1C1C20;--navy4:#2A2A2F;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --txt:#F0F0F2;--muted:#8B8C93;--dim:#5E5F66;--topbg:rgba(10,10,11,.93);
}
[data-theme="claro"]{
  --navy:#F3F5F9;--navy2:#FFFFFF;--navy3:#EEF1F6;--navy4:#E1E6EE;
  --line:rgba(13,18,32,.08);--line2:rgba(13,18,32,.14);
  --txt:#0D1220;--muted:#5B6478;--dim:#8A93A6;
  --green:#12A35A;--green-soft:rgba(18,163,90,.12);
  --red:#E04848;--red-soft:rgba(224,72,72,.10);
  --amber:#B97E00;--amber-soft:rgba(217,154,0,.13);
  --blue:#2F6FD6;--blue-soft:rgba(47,111,214,.10);
  --topbg:rgba(243,245,249,.93);--hover:rgba(13,18,32,.025);
}
[data-theme="claro"] .card,[data-theme="claro"] .cr{box-shadow:0 1px 2px rgba(13,18,32,.04)}
.brand .logo-dark{display:none}
[data-theme="claro"] .brand .logo-light{display:none}[data-theme="claro"] .brand .logo-dark{display:block}
.theme-sw{display:flex;gap:4px;background:var(--navy3);border-radius:8px;padding:3px;margin-top:8px}
.theme-sw button{flex:1;border:0;background:transparent;color:var(--muted);font:600 11px Montserrat;padding:6px 0;border-radius:6px;cursor:pointer}
.theme-sw button.on{background:var(--navy2);color:var(--y);box-shadow:0 0 0 1px var(--line2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--txt);font-family:Montserrat,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* sidebar */
.side{background:var(--navy2);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:0 8px 18px}
.brand-logo{height:44px;width:auto;display:block;margin-bottom:10px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.nav-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13px;transition:.15s}
.nav a svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--navy3);color:var(--txt)}
.nav a.on{background:var(--y-soft);color:var(--y)}
.nav a .tag{margin-left:auto;font-size:9px;background:var(--navy4);color:var(--muted);padding:2px 6px;border-radius:4px;letter-spacing:.06em}
.nav a .cnt{margin-left:auto;font-size:10px;font-weight:700;background:var(--red-soft);color:var(--red);padding:1px 7px;border-radius:10px}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:11px;color:var(--dim);border-top:1px solid var(--line)}

/* main */
.main{padding:0 32px 64px;min-width:0}
.top{position:sticky;top:0;z-index:5;background:var(--topbg);backdrop-filter:blur(8px);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:20px 0 16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.top h1{font:700 30px/1 'Barlow Condensed';letter-spacing:.02em;text-transform:uppercase;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font:500 12px Montserrat;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:6px}
.ctl{display:flex;align-items:center;gap:6px;background:var(--navy2);border:1px solid var(--line2);border-radius:8px;padding:0 10px;height:36px;font-size:12px;color:var(--muted)}
.ctl select,.ctl input{background:transparent;border:0;color:var(--txt);font:500 12px Montserrat;outline:0;cursor:pointer;color-scheme:dark}
.ctl select option{background:var(--navy2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:var(--navy2);color:var(--txt);font:600 12px Montserrat;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--y);color:var(--y)}
.btn.pri{background:var(--y);color:var(--navy);border-color:var(--y)}
.btn.pri:hover{filter:brightness(1.08);color:var(--navy)}
.btn.icon{padding:0;width:36px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.demo{background:var(--y-soft);color:var(--y);font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;margin-bottom:18px;display:inline-block}

/* blocks */
.sec-title{font:700 18px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.08em;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title::before{content:"";width:4px;height:18px;background:var(--y);border-radius:2px}
.sec-title small{font:500 11px Montserrat;color:var(--dim);text-transform:none;letter-spacing:0;margin-left:4px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h3{font:600 12px Montserrat;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:500;font-size:11px}

/* kpi */
.kpi{display:flex;flex-direction:column}
.kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi .val{font:700 30px/1.1 'Barlow Condensed';margin:8px 0 6px;letter-spacing:.01em}
.kpi .val.y{color:var(--y)}
.kpi .row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.kpi .sub{font-size:11px;color:var(--dim)}
.kpi canvas.spark{height:34px!important;width:100%!important;margin-top:10px}
.goal{margin-top:10px}
.goal .gl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:4px}
.goal .gb{height:5px;background:var(--navy4);border-radius:3px;overflow:hidden}
.goal .gb span{display:block;height:100%;border-radius:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ok{background:var(--green)}.mid{background:var(--amber)}.bad{background:var(--red)}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.down{background:var(--red-soft);color:var(--red)}
.delta.flat{background:var(--navy4);color:var(--muted)}
.chart-box{position:relative;height:270px}
.chart-box.sm{height:210px}

/* summary + alerts */
.summary{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;background:linear-gradient(90deg,var(--y-soft),transparent 70%),var(--navy2);border:1px solid rgba(242,163,20,.25);border-radius:14px;padding:18px 22px;margin-bottom:14px}
.summary .badge{font:700 13px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--navy);background:var(--y);padding:6px 10px;border-radius:6px;line-height:1.1;text-align:center}
.summary .badge b{display:block;font-size:24px}
.summary ol{list-style:none;counter-reset:s}
.summary li{counter-increment:s;font-size:14px;padding:3px 0 3px 26px;position:relative}
.summary li::before{content:counter(s);position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;background:var(--navy4);color:var(--y);font:700 11px Montserrat;display:grid;place-items:center}
.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin-bottom:14px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:12.5px;border:1px solid var(--line)}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alert b{display:block;font-size:12.5px}
.alert span{color:var(--muted);font-size:11.5px}
.alert.danger{background:var(--red-soft);color:var(--red)}
.alert.warn{background:var(--amber-soft);color:var(--amber)}
.alert.info{background:var(--blue-soft);color:var(--blue)}
.alert b{color:var(--txt)}
.alert a{margin-left:auto;font-size:11px;font-weight:600;white-space:nowrap;align-self:center}

/* funnel */
.fun-row{display:grid;grid-template-columns:120px 1fr 74px;align-items:center;gap:12px;margin-bottom:10px}
.fun-row .n{font-size:12px;color:var(--muted)}
.fun-bar{height:30px;background:var(--navy3);border-radius:6px;overflow:hidden}
.fun-bar span{display:flex;align-items:center;height:100%;background:var(--y);color:var(--navy);font:700 15px 'Barlow Condensed';padding-left:10px;border-radius:6px;min-width:44px}
.fun-row .r{font-size:11px;color:var(--dim);text-align:right}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.g{color:var(--green)}td.r{color:var(--red)}td.a{color:var(--amber)}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;letter-spacing:.04em}
.p-rent{background:var(--blue-soft);color:var(--blue)}
.p-green{background:var(--green-soft);color:var(--green)}
.p-dream{background:rgba(196,140,255,.14);color:#C48CFF}
.p-trust{background:var(--y-soft);color:var(--y)}
.p-site{background:rgba(110,168,254,.14);color:var(--blue)}.p-rent{background:rgba(79,209,197,.14);color:#4FD1C5}.p-cargas{background:var(--amber-soft);color:var(--amber)}.p-outras{background:var(--navy4);color:var(--muted)}.p-produtos{background:rgba(196,140,255,.14);color:#C48CFF}.p-institucional{background:var(--navy4);color:var(--txt)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px}
.chip.ok{background:var(--green-soft);color:var(--green)}.chip.mid{background:var(--amber-soft);color:var(--amber)}.chip.bad{background:var(--red-soft);color:var(--red)}.chip.neu{background:var(--navy4);color:var(--muted)}
.lk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.hlp{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font:700 9.5px Montserrat;margin-left:6px;cursor:help;position:relative;vertical-align:middle;text-transform:none;letter-spacing:0;flex-shrink:0}
.hlp:hover,.hlp:focus{border-color:var(--y);color:var(--y);outline:0}
.hlp:hover::after,.hlp:focus::after{content:attr(data-h);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:260px;background:var(--navy4);color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font:500 11.5px/1.5 Montserrat;text-transform:none;letter-spacing:0;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:normal;text-align:left}
.kpi .hlp:hover::after,.kpi .hlp:focus::after{left:auto;right:-10px;transform:none}
.help-inline{display:none;font:500 11.5px/1.5 Montserrat;color:var(--muted);text-transform:none;letter-spacing:0;margin:-6px 0 12px;padding:8px 10px;background:var(--navy3);border-radius:8px}
.kpi .help-inline{margin:8px 0 0}
body.explain .help-inline{display:block}
.edf{display:inline-flex;align-items:center;gap:4px;background:var(--navy3);border:1px solid var(--line2);border-radius:7px;padding:0 8px;height:30px}
.edf.empty{border-style:dashed;border-color:rgba(242,163,20,.45)}
.edf:focus-within{border-color:var(--y);border-style:solid}
.edf i{font-style:normal;font-size:11px;color:var(--muted)}
.edf input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font:600 12.5px Montserrat;text-align:right;color-scheme:dark;-moz-appearance:textfield}
.edf input::placeholder{color:var(--y);opacity:.75;font-weight:500}
.edf input::-webkit-outer-spin-button,.edf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.st-up{color:var(--green)}.st-keep{color:var(--y)}.st-off{color:var(--red)}

/* creatives */
.cr{background:var(--navy2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cr-img{aspect-ratio:4/5;background:repeating-linear-gradient(45deg,var(--navy3) 0 10px,var(--navy2) 10px 20px);display:grid;place-items:center;color:var(--dim);font-size:11px;position:relative}
.cr-img .rank{position:absolute;top:10px;left:10px;background:var(--y);color:var(--navy);font:700 16px 'Barlow Condensed';width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
.cr-body{padding:14px 16px}
.cr-body b{display:block;font-size:13px;margin-bottom:6px}
.cr-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-size:11px;color:var(--muted)}
.cr-meta strong{display:block;font:700 18px 'Barlow Condensed';color:var(--txt)}

/* notes */
.note{border-left:3px solid var(--y);padding:4px 0 4px 14px;margin-bottom:14px}
.note.g{border-color:var(--green)}.note.r{border-color:var(--red)}.note.b{border-color:var(--blue)}
.note b{display:block;font-size:13px;margin-bottom:2px}
.note p{font-size:12.5px;color:var(--muted)}
ul.clean{list-style:none}
ul.clean li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px}
ul.clean li:last-child{border:0}
ul.clean li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--y);margin-top:7px;flex-shrink:0}

/* stat list */
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.stat:last-child{border:0}
.stat b{font:700 22px 'Barlow Condensed';color:var(--txt)}
.pace{height:12px;background:var(--navy4);border-radius:6px;position:relative;margin:14px 0 6px}
.pace span{position:absolute;left:0;top:0;bottom:0;background:var(--y);border-radius:6px}
.pace i{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--txt)}

/* products / fleet */
.prod .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.prod .head b{font:700 20px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.04em}
.prod .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prod .mini div{background:var(--navy3);border-radius:8px;padding:10px}
.prod .mini span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.prod .mini strong{font:700 22px 'Barlow Condensed'}
.occ{display:flex;align-items:center;gap:8px}
.occ .bar{width:90px;height:6px;background:var(--navy4);border-radius:3px;overflow:hidden}
.occ .bar span{display:block;height:100%}

/* heatmap + cohort */
.heat{display:grid;grid-template-columns:44px repeat(9,1fr);gap:3px;font-size:10px;color:var(--dim)}
.heat div{height:26px;border-radius:4px;display:grid;place-items:center}
.heat .c{color:var(--navy);font-weight:700;font-size:10px}
.heat .h{height:auto;padding-bottom:4px}
.coh td.c{text-align:center;font-weight:700;font-size:12px;border-radius:0}

/* upload */
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:20px;text-align:center;transition:.15s;cursor:pointer;background:var(--navy2);display:block}
.drop:hover{border-color:var(--y);background:var(--y-soft)}
.drop .ic{width:40px;height:40px;border-radius:10px;background:var(--navy3);display:grid;place-items:center;margin:0 auto 10px}
.drop .ic svg{width:20px;height:20px;stroke:var(--y);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;font-size:13px;margin-bottom:4px}
.drop p{font-size:11px;color:var(--muted)}
.drop .okf{color:var(--green);font-weight:600;font-size:11px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.field input,.field textarea{background:var(--navy3);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font:500 13px Montserrat;padding:10px 12px;text-transform:none;letter-spacing:0;outline:0;color-scheme:dark}
.field input:focus,.field textarea:focus{border-color:var(--y)}
.field textarea{min-height:100px;resize:vertical}
.hist-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.hist-row:last-child{border:0}
.hist-row .wk{font:700 22px 'Barlow Condensed';color:var(--y);width:70px}
.hist-row .inf{flex:1}
.hist-row .inf b{display:block;font-size:13px}
.hist-row .inf span{font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:20px 0}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--navy2);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(560px,100%)}
.modal h4{font:700 20px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.modal p{font-size:12px;color:var(--muted);margin-bottom:12px}
.modal textarea{width:100%;height:320px;background:var(--navy3);border:1px solid var(--line2);border-radius:10px;color:var(--txt);font:12.5px/1.55 Montserrat;padding:14px;resize:vertical}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* presentation */
.pres-ctl{display:none}
body.present .side,body.present .top .ctl,body.present .top .btn,body.present .demo{display:none!important}
body.present .app{grid-template-columns:1fr}
body.present .main{max-width:1360px;margin:0 auto;width:100%}
body.present .top h1{font-size:40px}
body.present .pres-ctl{display:flex;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;align-items:center;gap:10px;background:var(--navy2);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pres-ctl span{font-size:12px;color:var(--muted);min-width:170px;text-align:center}
.pres-ctl span b{color:var(--txt)}

@media (min-width:1151px){.top{flex-wrap:nowrap}.top h1{font-size:28px}.top .ctl select{max-width:260px}}
@media (max-width:1150px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-wide{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;gap:4px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.nav-label,.side-foot{display:none}
  .nav{display:flex;gap:4px}.nav a{white-space:nowrap}
  .main{padding:0 16px 40px}.g2,.g3{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr}
}
@media print{
  .side,.top .ctl,.top .btn,.demo,.pres-ctl{display:none!important}
  .app{grid-template-columns:1fr}.top{position:static}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* animações de entrada */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#view.anim .card{animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){#view.anim .card{animation:none}}
@media print{#view.anim .card{animation:none}}
#view>.sec-title:first-child{margin-top:0}
@media(min-width:1000px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
tr.hl td{background:rgba(242,163,20,.08)}
select.edf,input.edf[type=date]{color:var(--txt,#EEF1F7);background:var(--navy3);border:1px solid var(--line2);border-radius:8px;padding:0 10px;font:600 13px Montserrat;color-scheme:dark}
[data-theme=claro] select.edf,[data-theme=claro] input.edf[type=date]{color-scheme:light}
.cmp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cmp-card{background:var(--navy3);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 13px Montserrat;margin-bottom:12px}
.cc-p{font:700 12px Montserrat;padding:3px 8px;border-radius:6px;white-space:nowrap}
.cc-r{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:8px;margin:7px 0}
.cc-r i{font:700 11px Montserrat;font-style:normal;color:var(--dim)}
.cc-r b{font:700 15px 'Barlow Condensed';letter-spacing:.02em;min-width:72px;text-align:right}
.cc-b{height:10px;background:var(--navy4);border-radius:5px;overflow:hidden}.cc-b span{display:block;height:100%;border-radius:5px}
.cc-w{font-size:11px;margin-top:8px;font-weight:600}
.sheet-t td{max-width:340px;white-space:normal;vertical-align:top;font-size:12px}.sheet-t th{white-space:normal;min-width:90px;font-size:10.5px}
.cmp-all td,.cmp-all th{white-space:nowrap}
</style>
</head>

/* =====================================================================
   DADOS REAIS MENSAIS — Meta (campanhas + fatura) e reservas do Yalla Digital
   REAL_DEFAULT = última versão publicada; importações no navegador são
   mescladas por mês e ficam salvas localmente até serem publicadas.
   Reservas: só contagens agregadas, nenhum dado pessoal.
   ===================================================================== */
/* Leitores das exportações mensais da Yalla.
   - Reservas do Yalla Digital (.xlsx "reservas_todas"): agregadas por mês da DATA DA RESERVA.
     Nenhum dado pessoal (nome, CPF, telefone, vendedor) sai deste leitor — só contagens.
   - Relatório de campanhas da Meta (.csv) e fatura da Meta (.csv "VERBA").
   Funcionam no navegador (XLSX global) e no Node (require("xlsx")). */
const MES_ABR = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const monthLabel = (mm, yyyy) => `${MES_ABR[+mm - 1]}/${String(yyyy).slice(-2)}`;
const monthSortKey = l => { const [m, y] = l.split("/"); return y + String(MES_ABR.indexOf(m)).padStart(2, "0"); };
const STATUS_LEAD_ORDER = ["Contratos Comissionáveis","Contrato Enviado","Aprovado","Acordo Pendente","Pendente Documento","Segunda Validação","Clientes Futuros","Reprovado","Lead Perdido"];

function parseBRDate(v){
  if (v == null) return null;
  if (v instanceof Date) return v;
  if (typeof v === "number"){ const d = new Date(Math.round((v - 25569) * 864e5)); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes()); }
  const m = String(v).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) : null;
}

/* ---------- reservas ---------- */
function aggregateReservas(XLSX, buffers){
  const seen = new Set(), months = {};
  const bump = (o, k, n = 1) => { o[k] = (o[k] || 0) + n; };
  for (const buf of buffers){
    const wb = XLSX.read(buf, {type: buf instanceof ArrayBuffer ? "array" : "buffer"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: null, raw: false});
    for (const r of rows){
      const prot = r["Protocolo"]; if (prot && seen.has(prot)) continue; if (prot) seen.add(prot);
      const res = parseBRDate(r["Data da reserva"]), sol = parseBRDate(r["Data da solicitação"]);
      if (!res) continue;
      const key = monthLabel(res.getMonth() + 1, res.getFullYear());
      const M = months[key] = months[key] || {total:0, statusLead:{}, modalidade:{}, origem:{}, modelos:{}, modelosContr:{}, modalidadeContr:{}, origemContr:{}, ant:[], heat:Array.from({length:7}, () => Array(12).fill(0)), first:null, last:null};
      M.total++;
      const st = r["Status do Lead"] || "Sem status"; bump(M.statusLead, st);
      bump(M.modalidade, r["Modalidade"] || "Sem modalidade");
      bump(M.origem, r["Origem"] || "Sem origem");
      const mod = r["Veículo / Modelo"] || "Sem modelo"; bump(M.modelos, mod);
      if (st === "Contratos Comissionáveis"){ bump(M.modelosContr, mod); bump(M.modalidadeContr, r["Modalidade"] || "Sem modalidade"); bump(M.origemContr, r["Origem"] || "Sem origem"); }
      if (sol){
        const a = Math.round((new Date(res.getFullYear(), res.getMonth(), res.getDate()) - new Date(sol.getFullYear(), sol.getMonth(), sol.getDate())) / 864e5);
        if (a >= 0 && a < 120) M.ant.push(a);
        M.heat[(sol.getDay() + 6) % 7][Math.floor(sol.getHours() / 2)]++;
      }
      const d = `${res.getFullYear()}-${String(res.getMonth() + 1).padStart(2, "0")}-${String(res.getDate()).padStart(2, "0")}`;
      if (!M.first || d < M.first) M.first = d; if (!M.last || d > M.last) M.last = d;
    }
  }
  for (const k in months){ const a = months[k].ant.sort((x, y) => x - y); months[k].antMediana = a.length ? a[Math.floor(a.length / 2)] : null; delete months[k].ant; }
  return months;
}

/* ---------- Meta: relatório de campanhas ---------- */
function metaLine(c){
  const u = String(c || "").toUpperCase();
  if (u.includes("GREEN")) return "GREEN"; if (u.includes("[RENT]")) return "RENT"; if (u.includes("DREAM")) return "DREAM";
  if (u.includes("[TRUST]")) return "TRUST"; if (u.includes("SITE")) return "SITE"; if (u.includes("CARGAS")) return "CARGAS"; return "OUTRAS";
}
function parseMetaCampaigns(XLSX, text){
  text = String(text).replace(/^\uFEFF/, "");
  const wb = XLSX.read(text, {type: "string", raw: true});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: null, raw: true});
  const num = v => v == null || v === "" ? 0 : typeof v === "number" ? v : parseFloat(String(v).replace(",", ".")) || 0;
  let key = null; const out = [];
  for (const r of rows){
    const sp = num(r["Valor gasto (BRL)"]); if (sp < 0.5) continue;
    const ini = String(r["Início dos relatórios"] || ""); const m = ini.match(/^(\d{4})-(\d{2})/);
    if (m && !key) key = monthLabel(m[2], m[1]);
    out.push({c: r["Nome da campanha"], a: r["Nome do conjunto de anúncios"], l: metaLine(r["Nome da campanha"]), reach: num(r["Alcance"]), impr: num(r["Impressões"]),
      freq: +num(r["Frequência"]).toFixed(2), rt: r["Tipo de resultado"] || "", res: num(r["Resultados"]), spend: +sp.toFixed(2), leads: num(r["Leads"])});
  }
  if (!key) throw new Error("Não achei a coluna 'Início dos relatórios' — confira se é o relatório de campanhas da Meta.");
  return {month: key, rows: out.sort((a, b) => b.spend - a.spend)};
}

/* ---------- Meta: fatura (relatório de cobrança) ---------- */
function parseMetaBill(text){
  const p = text.match(/Relatório de cobrança:\s*(\d{2})\/(\d{2})\/(\d{4})/);
  if (!p) throw new Error("Não achei 'Relatório de cobrança' — confira se é a fatura da Meta.");
  const tots = [...text.matchAll(/Valor total cobrado,"?([\d.,]+)"?/g)].map(m => parseFloat(m[1].replace(/\./g, "").replace(",", ".")));
  return {month: monthLabel(p[2], p[3]), bill: +(tots[0] || 0).toFixed(2), credit: +tots.slice(1).reduce((a, b) => a + b, 0).toFixed(2)};
}

/* ---------- Google Ads: "Cards da Visão geral" (CSVs do .zip) ---------- */
const numBR = v => { if (v == null) return 0; if (typeof v === "number") return v;
  const t = String(v).replace(/R\$|\s|%/g, "").replace(/\./g, "").replace(",", "."); const n = parseFloat(t); return isNaN(n) ? 0 : n; };
function csvRows(XLSX, text){
  text = String(text).replace(/^﻿/, "");
  const wb = XLSX.read(text, {type: "string", raw: true});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: null, raw: true});
}
const googleLine = c => { const m = String(c || "").match(/^\[([^\]]+)\]/); return m ? m[1].toUpperCase() : "OUTRAS"; };
/* files: [{name, text}] — um ou vários meses; o mês vem do nome do arquivo (AAAA.MM.DD-AAAA.MM.DD) */
function parseGoogleCards(XLSX, files){
  const months = {};
  for (const f of files){
    const m = f.name.match(/\((?:[^_)]*_)?(\d{4})\.(\d{2})\.\d{2}-\d{4}\.\d{2}\.\d{2}/); if (!m) continue;
    const key = monthLabel(m[2], m[1]); const G = months[key] = months[key] || {};
    const base = f.name.replace(/^.*\//, "");
    const rows = csvRows(XLSX, f.text);
    if (/^Campanhas/i.test(base)) G.campaigns = rows.map(r => ({c: r["Nome da campanha"], l: googleLine(r["Nome da campanha"]), status: r["Status da campanha"], cost: numBR(r["Custo"]), conv: numBR(r["Conversões"])})).sort((a, b) => b.cost - a.cost);
    else if (/^Redes/i.test(base)) G.networks = rows.map(r => ({n: r["Rede"], clicks: numBR(r["Cliques"]), cost: numBR(r["Custo"])}));
    else if (/^Dispositivos/i.test(base)) G.devices = rows.map(r => ({d: r["Dispositivo"], cost: numBR(r["Custo"]), clicks: numBR(r["Cliques"]), conv: numBR(r["Conversões"])}));
    else if (/^Palavras-chave/i.test(base)) G.keywords = rows.slice(0, 15).map(r => ({k: r["Palavra-chave da rede de pesquisa"], match: r["Tipo de corresp."], cost: numBR(r["Custo"]), clicks: numBR(r["Cliques"]), ctr: numBR(r["CTR"])}));
    else if (/^Pesquisas\(Pesquisar/i.test(base)) G.searches = rows.slice(0, 15).map(r => ({q: r["Pesquisar"], cost: numBR(r["Custo"]), clicks: numBR(r["Cliques"]), impr: numBR(r["Impressões"]), conv: numBR(r["Conversões"])}));
    else if (/^Pesquisas\(Palavra/i.test(base)) G.words = rows.slice(0, 15).map(r => ({w: r["Palavra"], cost: numBR(r["Custo"]), clicks: numBR(r["Cliques"]), impr: numBR(r["Impressões"]), top: r["Principais consultas com a palavra"]}));
    else if (/^S.rie_temporal/i.test(base)) G.daily = rows.map(r => ({clicks: numBR(r["Cliques"]), conv: numBR(r["Conversões"])}));
    else if (/Idade_\d/i.test(base) && !/Sexo/i.test(base)) G.age = rows.map(r => ({a: r["Faixa de idade"], impr: numBR(r["Impressões"])}));
  }
  for (const k in months){ const G = months[k];
    G.cost = +(G.campaigns || []).reduce((s, c) => s + c.cost, 0).toFixed(2);
    G.conv = +(G.campaigns || []).reduce((s, c) => s + c.conv, 0).toFixed(2);
    G.clicks = (G.networks || []).reduce((s, n) => s + n.clicks, 0) || (G.daily || []).reduce((s, d) => s + d.clicks, 0);
  }
  return months;
}

/* Leitor da planilha "Comparativo Yalla x Concorrentes".
   Funciona no navegador (SheetJS global XLSX) e no Node (require("xlsx")).
   Localiza as tabelas pelo nome das colunas, não por posição fixa. */
function parseCompetition(XLSX, data, fileName){
  const wb = XLSX.read(data, {type: data instanceof ArrayBuffer ? "array" : "buffer"});
  const rowsOf = n => wb.Sheets[n] ? XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null}) : [];
  const clean = v => v == null ? null : (typeof v === "string" ? (v.trim() === "" ? null : v.trim()) : v);
  const numv = v => { if (v == null || v === "") return null; if (typeof v === "number") return v;
    const n = parseFloat(String(v).replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return isNaN(n) ? null : n; };
  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();

  function table(sheet, must, map, opt = {}){
    const rows = rowsOf(sheet); if (!rows.length) return [];
    const h = rows.findIndex(r => must.every(m => r.some(c => norm(c) === norm(m))));
    if (h < 0) return [];
    const head = rows[h].map(norm), out = [];
    const idx = {}; for (const k in map){ const t = map[k];
      idx[k] = t instanceof RegExp ? head.findIndex(x => t.test(x)) : head.indexOf(norm(t)); }
    for (let i = h + 1; i < rows.length; i++){
      const r = rows[i], filled = r.filter(v => clean(v) != null).length;
      if (filled === 0){ if (out.length && opt.stopOnBlank) break; continue; }
      if (filled <= 1 && out.length) break;            /* linha de nota: fim da tabela */
      const o = {}; for (const k in idx) o[k] = idx[k] >= 0 ? clean(r[idx[k]]) : null;
      if (opt.key && o[opt.key] == null) continue;
      out.push(o);
    }
    return out;
  }

  /* ---- data da consulta e ressalvas */
  const exec = rowsOf("Painel Executivo");
  const textCells = exec.map(r => r.filter(v => clean(v) != null)).filter(r => r.length === 1 && typeof r[0] === "string");
  const allText = textCells.map(r => r[0]).join(" ");
  const dm = allText.match(/(\d{2}\/\d{2}\/\d{4})/) || String(fileName || "").match(/(\d{2})-(\d{2})-(\d{4})/);
  const date = dm ? (dm[1].includes("/") ? dm[1] : `${dm[1]}/${dm[2]}/${dm[3]}`) : null;
  const notes = textCells.slice(1).map(r => r[0]).filter(t => !/^PRIORIDADE/i.test(t) && t.length > 30);

  /* ---- prioridades */
  const priorities = [];
  const pi = exec.findIndex(r => r.some(c => /^PRIORIDADE/i.test(String(c || ""))));
  if (pi >= 0) for (let i = pi + 1; i < exec.length; i++){
    const r = exec[i].map(clean); if (!r[0]) break;
    if (r[1] && r[2]) priorities.push({model: r[0], text: r[1], tag: r[2]});
    else break;
  }

  /* ---- tabelas */
  const frota = table("Frota Yalla", ["Modelo Yalla", "Categoria"], {
    cat:"Categoria", marca:"Marca", modelo:"Modelo Yalla", motor:"Motorização", cambio:"Câmbio",
    p5:/^5\.000 km/, p6:/^6\.000 km/, livre:/^km livre/, produto:"Produto na vitrine", revisao:"Revisão", hist:/^reserva historica/
  }, {key:"modelo"});

  const comparativo = table("Comparativo", ["Modelo Yalla", "Conc. R$/sem."], {
    cat:"Categoria", modelo:"Modelo Yalla", yalla:"Yalla R$/sem.", conc:"Concorrente / locadora", concModelo:"Modelo concorrente",
    concPreco:"Conc. R$/sem.", gap:"Gap R$/sem.", gapPct:"Gap %", equiv:"Equivalência", obs:"Interpretação / cuidados",
    fonte:"Fonte concorrente", id:"ID oferta", status:"Status de comparabilidade", produto:"Produto da Yalla"
  }, {key:"modelo"});

  const radarSheet = wb.SheetNames.filter(n => /^radar/i.test(n))
    .map(n => ({n, d: (n.match(/(\d{2})-(\d{2})/) || [])}))
    .filter(x => x.d.length).sort((a, b) => (a.d[2] + a.d[1]).localeCompare(b.d[2] + b.d[1]))
    .map(x => x.n).reverse().find(n => table(n, ["Modelo Yalla", "Conc. R$/sem."], {m:"Modelo Yalla"}).length);
  const radar = radarSheet ? table(radarSheet, ["Modelo Yalla", "Conc. R$/sem."], {
    modelo:"Modelo Yalla", modalidade:"Modalidade", yalla:"Yalla R$/sem.", conc:"Locadora concorrente", oferta:/^oferta/,
    preco:"Conc. R$/sem.", gap:"Gap Yalla R$", gapPct:/^gap vs/, situacao:/^situacao/, condicao:/^condicao/, fonte:"Fonte rival"
  }, {key:"modelo"}) : [];

  const ofertas = table("Ofertas Concorrentes", ["ID", "R$/semana"], {
    id:"ID", locadora:"Nome da locadora / canal", modelo:"Modelo anunciado", preco:"R$/semana", tipo:"Tipo de tarifa",
    km:"Quilometragem", caucao:"Caução R$", praca:"Praça", equiv:"Equivalência", fonte:"Fonte / link", obs:"Observação / condição",
    produto:"Produto deste anúncio", revisao:"Revisão pública", status:"Status", anterior:"Tarifa anterior R$/sem.",
    natureza:/^natureza do preco/, validade:"Controle de validade / ressalva"
  }, {key:"id"});

  const rent = table("Rent - Diarias", ["Locadora", "Plano Rent"], {
    locadora:"Locadora", plano:"Plano Rent", modelo:"Modelo / grupo", regime:"Regime", preco:"Preço diário anunciado R$",
    outros:"Outros valores publicados", ressalva:"Ressalvas de comparação", fonte:"Fonte URL", status:"Status"
  }, {key:"locadora"});

  const dream = table("Dream - Compra", ["Concorrente", "Plano"], {
    empresa:"Concorrente", plano:"Plano", modelo:"Modelo/versão", segmento:"Segmento", semanal:"Semanal visível R$",
    prazo:"Prazo / momento compra", entrada:"Entrada / caução", status:"Status da condição", obs:"Observações", fonte:"Fonte oficial"
  }, {key:"empresa"});

  const benchmarks = table("Benchmarks Categoria", ["Categoria", "Concorrente / fornecedor"], {
    cat:"Categoria", empresa:"Concorrente / fornecedor", preco:"Preço sem./base", cond:"Condição", fonte:"Link de fonte"
  }, {key:"cat"});

  /* ---- histórico de preços Yalla (todas as abas "Historico ...") */
  const yHist = {};
  wb.SheetNames.filter(n => /^historico/i.test(norm(n))).forEach(n => {
    const rows = rowsOf(n);
    const h = rows.findIndex(r => r.some(c => /^modelo/.test(norm(c))));
    if (h < 0) return;
    const head = rows[h].map(c => String(c || ""));
    const mi = head.findIndex(c => /^modelo/i.test(norm(c)));
    const cols = [];
    head.forEach((c, i) => {
      let m = c.match(/^(\d{2}\/\d{2})\s*•\s*5 mil/i) || c.match(/^Yalla (\d{2}\/\d{2})$/i);
      if (m) cols.push({i, d: m[1]});
    });
    if (!cols.length) return;
    for (let r = h + 1; r < rows.length; r++){
      const filled = rows[r].filter(v => clean(v) != null).length;
      if (filled <= 1) break;                                         /* nota: fim da tabela */
      if (rows[r].some(c => /^(locadora|modelo)/.test(norm(c)))) break; /* começou outra tabela */
      const model = clean(rows[r][mi]); if (!model || typeof model !== "string") continue;
      cols.forEach(c => { const v = numv(rows[r][c.i]); if (v){ (yHist[model] = yHist[model] || {})[c.d] = v; } });
    }
  });
  /* preço atual da frota entra como ponto da data da consulta */
  if (date) frota.forEach(f => { const v = numv(f.p5); if (v) (yHist[f.modelo] = yHist[f.modelo] || {})[date.slice(0, 5)] = v; });

  /* normaliza números */
  comparativo.forEach(c => { c.yalla = numv(c.yalla); c.concPreco = numv(c.concPreco); c.gap = numv(c.gap); c.gapPct = numv(c.gapPct); });
  radar.forEach(c => { c.yalla = numv(c.yalla); c.preco = numv(c.preco); c.gap = numv(c.gap); c.gapPct = numv(c.gapPct); });
  ofertas.forEach(o => { o.preco = numv(o.preco); o.anterior = numv(o.anterior); o.caucao = numv(o.caucao); });
  frota.forEach(f => { f.p5 = numv(f.p5); f.p6 = numv(f.p6); f.livre = numv(f.livre); f.hist = numv(f.hist); });
  rent.forEach(r => r.preco = numv(r.preco)); dream.forEach(d => d.semanal = numv(d.semanal)); benchmarks.forEach(b => b.preco = numv(b.preco));

  return {file: fileName || null, date, importedAt: new Date().toISOString(), notes, priorities,
    frota, comparativo, radarSheet, radar, ofertas, rent, dream, benchmarks, yHist};
}

try{const c=localStorage.getItem("yalla-comp");if(c){const x=JSON.parse(c);if(x&&x.comparativo)COMP=x;}}catch(e){}

/* ---- planilha de concorrentes online (Google Sheets via /api/concorrentes) ---- */
const COMP_SHEET_URL="https://docs.google.com/spreadsheets/d/1kVjeFlQ6z9mJeZrR8CExD8WGwMkB6C8e4GQPFrxOSMk/edit";
const COMP_LIVE={st:"idle",at:null,msg:""};
async function syncCompLive(manual){
  if(!/^https?:/.test(location.protocol)||COMP_LIVE.st==="loading")return;
  if(typeof XLSX==="undefined"){COMP_LIVE.st="erro";COMP_LIVE.msg="leitor de planilha não carregou";return;}
  COMP_LIVE.st="loading";if(manual&&state.page==="concorrencia")render();
  try{
    const r=await fetch("/api/concorrentes"+(manual?"?t="+Date.now():""),{cache:manual?"no-store":"default"});
    if(!r.ok){let m="erro "+r.status;try{m=(await r.json()).error||m}catch(e){}throw new Error(m);}
    const buf=await r.arrayBuffer();const d=parseCompetition(XLSX,buf,"Google Sheets");setCompRaw(XLSX,buf);
    if(!d.comparativo.length&&!d.ofertas.length)throw new Error("não encontrei as abas Comparativo e Ofertas Concorrentes");
    const changed=JSON.stringify(d)!==JSON.stringify(COMP);
    COMP=d;const sm=compSummary(d);COMP_SNAPS=COMP_SNAPS.filter(x=>x.date!==sm.date).concat(sm);
    try{localStorage.setItem("yalla-comp",JSON.stringify(d));localStorage.setItem("yalla-comp-snaps",JSON.stringify(COMP_SNAPS));}catch(e){}
    COMP_LIVE.st="ok";COMP_LIVE.at=new Date();COMP_LIVE.msg="";
    if(changed){state.alerts=buildAlerts(R());renderNav();}
    if(state.page==="concorrencia"&&(changed||manual))render();else if(state.page==="concorrencia"){const el=document.getElementById("compLive");if(el)el.outerHTML=compLiveHTML();}
  }catch(e){COMP_LIVE.st="erro";COMP_LIVE.msg=e.message;if(state.page==="concorrencia")render();}
}
function compLiveHTML(){
  const L=COMP_LIVE,hh=d=>d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const txt=!/^https?:/.test(location.protocol)?"Abra pelo link do painel para ler a planilha online":L.st==="loading"?"Lendo a planilha online…":L.st==="ok"?`✓ Sincronizado com a planilha online às ${hh(L.at)}`:L.st==="erro"?"Não consegui ler a planilha online: "+L.msg:"Planilha online conectada";
  const col=L.st==="ok"?"var(--green)":L.st==="erro"?"var(--red)":"var(--muted)";
  return`<div id="compLive" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:${col};margin-top:8px"><span>${txt}</span>
    <button class="btn" style="height:26px;font-size:11px" onclick="syncCompLive(true)" ${L.st==="loading"?"disabled":""}>Atualizar agora</button>
    <a href="${COMP_SHEET_URL}" target="_blank" rel="noopener" style="color:var(--y);font-size:11px">abrir planilha</a></div>`;
}
/* converte todas as abas da planilha em linhas de texto no formato brasileiro */
function sheetsToRows(XLSX, wb){
  const out={},fmtBR=(v,d)=>v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
  for(const n of wb.SheetNames){
    const ws=wb.Sheets[n];if(!ws||!ws["!ref"]){out[n]=[];continue;}
    const R=XLSX.utils.decode_range(ws["!ref"]),rows=[];
    for(let r=R.s.r;r<=R.e.r;r++){const row=[];
      for(let c=R.s.c;c<=R.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r,c})];let s="";
        if(cell){const z=String(cell.z||(cell.XF&&cell.XF.numFmt)||"");
          if(cell.t==="n"){const v=cell.v;
            if(/R\$|\[\$R\$/.test(z))s=(v<0?"-":"")+"R$ "+fmtBR(Math.abs(v),2);
            else if(/%/.test(z))s=fmtBR(v*100,1)+"%";
            else if(/[dmy]{2}/i.test(z)&&!/[#0]/.test(z.replace(/\[.*?\]/g,""))){const d=XLSX.SSF.parse_date_code(v);s=d?String(d.d).padStart(2,"0")+"/"+String(d.m).padStart(2,"0")+"/"+d.y:String(v);}
            else s=Number.isInteger(v)?fmtBR(v,0):fmtBR(v,2);}
          else if(cell.t==="d"&&cell.v instanceof Date){const d=cell.v;s=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
          else if(cell.t==="b")s=cell.v?"Sim":"Não";
          else s=String(cell.w!=null&&cell.t!=="s"?cell.w:(cell.v??"")).trim();}
        row.push(s);}
      while(row.length&&row[row.length-1]==="")row.pop();rows.push(row);}
    while(rows.length&&!rows[rows.length-1].length)rows.pop();
    out[n]=rows;}
  return out;
}

function delta(cur,prev,goodUp=true){
  if(!COMPARE||prev==null||cur==null)return"";
  if(state.mTo&&PARTIAL[state.mTo]&&REAL_PAGES.includes(state.page)&&state.page!=="comparar")return'<span class="delta flat" title="Mês parcial: comparação com o mês anterior completo não faz sentido">parcial</span>';

function rev(r){

  const ltv=rv.ticket*rv.margin*rv.stayWeeks;

}

  root.querySelectorAll(".kpi .val, .big-num").forEach(el=>{
    if(el.children.length)return;const txt=el.textContent,m=txt.match(/\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?/);if(!m)return;
    const raw=m[0],dec=(raw.split(",")[1]||"").length,n=parseFloat(raw.replace(/\./g,"").replace(",","."));if(!isFinite(n)||!n)return;
    const pre=txt.slice(0,m.index),suf=txt.slice(m.index+raw.length),grp=raw.includes(".");
    const fmt=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:grp});
    el.dataset.final=txt;const t0=performance.now(),D=900;

      if(p<1&&el.isConnected){el.textContent=pre+fmt(n*k)+suf;requestAnimationFrame(step);}else{el.textContent=txt;delete el.dataset.final;}};

metas(){

function heatHTML(){
  const hrs=["6h","8h","10h","12h","14h","16h","18h","20h","22h"],days=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const prof=[2,6,9,8,7,8,10,9,4],df=[1,1.05,1,1.1,1.15,.8,.6];
  const vals=days.map((_,d)=>prof.map(p=>Math.round(p*df[d]*1.2))),max=Math.max(...vals.flat());
  return`<div class="heat"><div class="h"></div>${hrs.map(h=>`<div class="h">${h}</div>`).join("")}
    ${days.map((d,i)=>`<div style="justify-content:start">${d}</div>${vals[i].map(v=>`<div class="c" style="background:rgba(242,163,20,${(.08+v/max*.92).toFixed(2)})" title="${d} ${v} leads">${v}</div>`).join("")}`).join("")}</div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:12px">Pico entre 18h e 22h, de segunda a sexta. Fim de semana com metade do volume.</p>`;

function resHeatHTML(RS){
  const days=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"],hrs=[...Array(12)].map((_,i)=>(i*2)+"h");
  const H=days.map((_,d)=>hrs.map((_,h)=>RS.months.reduce((s,m)=>s+(RS.R_(m).heat?.[d]?.[h]||0),0))),max=Math.max(...H.flat())||1;
  const peak=H.flatMap((r,d)=>r.map((v,h)=>({v,d,h}))).sort((a,b)=>b.v-a.v)[0];
  const byH=hrs.map((_,h)=>H.reduce((s,r)=>s+r[h],0)),tot=byH.reduce((a,b)=>a+b,0);
  const night=byH[9]+byH[10]+byH[11];
  return`<div class="heat" style="grid-template-columns:44px repeat(12,1fr)"><div class="h"></div>${hrs.map(h=>`<div class="h">${h}</div>`).join("")}
    ${days.map((d,i)=>`<div style="justify-content:start">${d}</div>${H[i].map(v=>`<div class="c" style="background:rgba(242,163,20,${(.06+v/max*.94).toFixed(2)})" title="${d}: ${v} solicitações">${v}</div>`).join("")}`).join("")}</div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:12px">Pico: ${days[peak.d]}, das ${peak.h*2}h às ${peak.h*2+2}h. ${pct(night/tot*100,0)} das solicitações chegam depois das 18h — horário em que o atendimento precisa estar coberto.</p>`;
}

const helpKey=t=>String(t||"").replace(/\s+/g," ").trim().toLowerCase().replace(/\s+(em|de|—|-)\s+[a-zç]{3}\/\d{2}.*$/i,"").replace(/^aba radar.*/,"aba radar").trim();
const helpFor=t=>{const k=helpKey(t);return(HELP[state.page]||{})[k]||HELP._[k]||null;};
const escA=t=>t.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function attachHelp(){
  document.querySelectorAll("#view .kpi .lbl, #view .card > h3").forEach(el=>{
    if(el.querySelector(".hlp"))return;
    const own=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join(" ").trim();
    const h=helpFor(own);if(!h)return;
    const ic=document.createElement("span");ic.className="hlp";ic.tabIndex=0;ic.textContent="?";ic.dataset.h=h;ic.setAttribute("aria-label",h);
    const firstText=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim());
    firstText?firstText.after(ic):el.appendChild(ic);
    const p=document.createElement("p");p.className="help-inline";p.textContent=h;
    if(el.classList.contains("lbl"))el.parentNode.appendChild(p);else el.after(p);
  });
}

• *Total: ${brl(MD.total[L])}*${d(MD.total[L],L?MD.total[L-1]:null)}

• Contratos: ${con!=null?num(con):"—"}${d(con,pcon)}

${state.alerts.filter(x=>!x.ex).slice(0,3).map(a=>"- "+a.t).join("\n")||"- Sem alertas"}

Painel completo: ${location.href.split("#")[0]}`;

function openWpp(){document.getElementById("wppText").value=wppText();document.getElementById("wppModal").classList.add("open");}
function closeWpp(){document.getElementById("wppModal").classList.remove("open");}
function copyWpp(){const t=document.getElementById("wppText");t.select();navigator.clipboard?.writeText(t.value);const b=document.getElementById("wppCopy");b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar",1500);}

/* =====================================================================
   MODO APRESENTAÇÃO
   ===================================================================== */
const PRES=PAGES.filter(p=>p.id&&!["historico","importar"].includes(p.id)).map(p=>p.id);
function presentStart(){document.body.classList.add("present");if(!PRES.includes(state.page))location.hash="#geral";updPres();}
function presentStop(){document.body.classList.remove("present");}
function presentGo(n){let i=PRES.indexOf(state.page)+n;i=Math.max(0,Math.min(PRES.length-1,i));location.hash="#"+PRES[i];}
function updPres(){const i=PRES.indexOf(state.page);document.getElementById("presInfo").innerHTML=`<b>${i+1} / ${PRES.length}</b> · ${PAGES.find(p=>p.id===state.page).name}`;}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeWpp();presentStop();}
  if(!document.body.classList.contains("present"))return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();presentGo(1);}
  if(e.key==="ArrowLeft")presentGo(-1);
});

/* =====================================================================
   IMPORTAÇÃO DA PLANILHA DE CONCORRÊNCIA
   ===================================================================== */
function allSnaps(){
  const m=new Map();[compSummary(COMP_DEFAULT),...COMP_SNAPS,compSummary(COMP)].forEach(x=>{if(x&&x.date)m.set(x.date,x);});
  return[...m.values()].sort((a,b)=>{const k=d=>d.split("/").reverse().join("");return k(b.date).localeCompare(k(a.date));});
}
async function importComp(input){
  const f=input.files[0],out=input.parentNode.querySelector(".okf");if(!f)return;
  if(typeof XLSX==="undefined"){out.style.color="var(--red)";out.textContent="Leitor de planilha não carregou. Verifique a conexão.";return;}
  try{
    const fb=await f.arrayBuffer();const d=parseCompetition(XLSX,fb,f.name);setCompRaw(XLSX,fb);
    if(!d.comparativo.length&&!d.ofertas.length)throw new Error("Não encontrei as abas Comparativo e Ofertas Concorrentes.");
    COMP=d;const sm=compSummary(d);COMP_SNAPS=COMP_SNAPS.filter(x=>x.date!==sm.date).concat(sm);
    try{localStorage.setItem("yalla-comp",JSON.stringify(d));localStorage.setItem("yalla-comp-snaps",JSON.stringify(COMP_SNAPS));}catch(e){}
    out.style.color="var(--green)";
    out.innerHTML=`✓ Consulta ${d.date||"sem data"} · ${d.comparativo.length} modelos · ${d.ofertas.length} ofertas<br><a href="#concorrencia" style="color:var(--y)">Ver na aba Concorrência</a>`;
    state.alerts=buildAlerts(R());renderNav();
  }catch(e){out.style.color="var(--red)";out.textContent="Não consegui ler: "+e.message;}
}
function saveReal(){try{const st=JSON.parse(localStorage.getItem("yalla-real")||'{"res":{},"meta":{}}');
  for(const k in REAL.res)if(JSON.stringify(REAL.res[k])!==JSON.stringify(REAL_DEFAULT.res[k]))st.res[k]=REAL.res[k];
  for(const k in REAL.meta)if(JSON.stringify(REAL.meta[k])!==JSON.stringify(REAL_DEFAULT.meta[k]))st.meta[k]=REAL.meta[k];
  st.channels=REAL.channels;
  st.google={};for(const k in REAL.google)if(JSON.stringify(REAL.google[k])!==JSON.stringify(REAL_DEFAULT.google?.[k]))st.google[k]=REAL.google[k];
  localStorage.setItem("yalla-real",JSON.stringify(st));}catch(e){}}
async function importRes(input){
  const out=input.parentNode.querySelector(".okf"),fs=[...input.files];if(!fs.length)return;
  if(typeof XLSX==="undefined"){out.style.color="var(--red)";out.textContent="Leitor de planilha não carregou.";return;}
  try{out.style.color="var(--muted)";out.textContent="Lendo "+fs.length+" arquivo(s)…";
    const agg=aggregateReservas(XLSX,await Promise.all(fs.map(f=>f.arrayBuffer())));const ks=Object.keys(agg);
    if(!ks.length)throw new Error("Não achei a coluna 'Data da reserva'.");
    ks.forEach(k=>REAL.res[k]=agg[k]);saveReal();
    out.style.color="var(--green)";out.innerHTML=`✓ ${sortM(ks).map(k=>k+": "+num(agg[k].total)).join(" · ")}<br><a href="#reservas" style="color:var(--y)">Ver em Reservas</a>`;
    state.alerts=buildAlerts(R());renderNav();
  }catch(e){out.style.color="var(--red)";out.textContent="Não consegui ler: "+e.message;}
}
async function importMeta(input){
  const out=input.parentNode.querySelector(".okf"),fs=[...input.files];if(!fs.length)return;
  if(typeof XLSX==="undefined"){out.style.color="var(--red)";out.textContent="Leitor de planilha não carregou.";return;}
  const msgs=[];
  for(const f of fs){try{const t=await f.text();
      if(/Relatório de cobrança/.test(t)){const b=parseMetaBill(t);REAL.meta[b.month]=Object.assign(REAL.meta[b.month]||{},{bill:b.bill,credit:b.credit});msgs.push(`fatura ${b.month}`);}
      else{const c=parseMetaCampaigns(XLSX,t);REAL.meta[c.month]=Object.assign(REAL.meta[c.month]||{},{rows:c.rows});msgs.push(`campanhas ${c.month}`);}
    }catch(e){msgs.push(`✗ ${f.name}: ${e.message}`);}}
  saveReal();out.style.color=msgs.some(m=>m.startsWith("✗"))?"var(--amber)":"var(--green)";
  out.innerHTML="✓ "+msgs.join(" · ")+'<br><a href="#mensal" style="color:var(--y)">Ver em Gasto mês a mês</a>';state.alerts=buildAlerts(R());renderNav();
}
function setInflCost(m,nm,v){REAL.inflCost[m]=REAL.inflCost[m]||{};const x=parseFloat(String(v).replace(",","."));if(x>0)REAL.inflCost[m][nm]=x;else delete REAL.inflCost[m][nm];
  try{localStorage.setItem("yalla-infl-cost",JSON.stringify(REAL.inflCost))}catch(e){}render();}
function saveManualChannel(){
  const g=id=>document.getElementById(id).value.trim(),out=document.getElementById("mcOut"),c=g("mcCh");
  let m=g("mcM");const mm=m.match(/^(\w{3})\/?(\d{2,4})$/i);
  if(!mm||!MES_ABR.map(x=>x.toLowerCase()).includes(mm[1].toLowerCase())){out.style.color="var(--red)";out.textContent="Use o mês no formato Nov/26.";return;}
  m=mm[1][0].toUpperCase()+mm[1].slice(1).toLowerCase()+"/"+mm[2].slice(-2);
  const sp=parseFloat(g("mcS").replace(",","."));if(!(sp>=0)){out.style.color="var(--red)";out.textContent="Informe o gasto do mês.";return;}
  REAL.channels[c]=REAL.channels[c]||{};REAL.channels[c][m]={spend:sp,impr:+g("mcI")||0,clicks:+g("mcC")||0};saveReal();
  out.style.color="var(--green)";out.textContent=`✓ ${c} ${m} salvo: ${brl(sp,2)}`;state.alerts=buildAlerts(R());renderNav();
}
async function importGoogle(input){
  const out=input.parentNode.querySelector(".okf"),fs=[...input.files];if(!fs.length)return;
  if(typeof XLSX==="undefined"){out.style.color="var(--red)";out.textContent="Leitor de planilha não carregou.";return;}
  try{const files=[];
    for(const f of fs){if(/\.zip$/i.test(f.name)){if(typeof JSZip==="undefined")throw new Error("leitor de .zip não carregou");const z=await JSZip.loadAsync(await f.arrayBuffer());
        for(const nm of Object.keys(z.files))if(/\.csv$/i.test(nm))files.push({name:nm,text:await z.files[nm].async("string")});}
      else files.push({name:f.name,text:await f.text()});}
    const g=parseGoogleCards(XLSX,files),ks=Object.keys(g);if(!ks.length)throw new Error("não reconheci os arquivos do Google Ads");
    ks.forEach(k=>{g[k].bill=REAL.google[k]?.bill??null;REAL.google[k]=g[k];});saveReal();
    out.style.color="var(--green)";out.innerHTML=`✓ ${sortM(ks).map(k=>k+": "+brl(g[k].cost,2)).join(" · ")}<br><a href="#google" style="color:var(--y)">Ver em Google Ads</a>`;state.alerts=buildAlerts(R());renderNav();
  }catch(e){out.style.color="var(--red)";out.textContent="Não consegui ler: "+e.message;}
}
function dlCSV(t,n){const b=new Blob(["\ufeff"+t],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function downloadReal(){const b=new Blob([JSON.stringify(REAL)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="yalla-dados-mensais.json";a.click();}
function downloadComp(){
  const b=new Blob([JSON.stringify(COMP,null,1)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=`concorrencia-${(COMP.date||"dados").replace(/\//g,"-")}.json`;a.click();
}

const state={page:"geral",report:"2026-S44",product:"all",alerts:[]};
{const ms=allRealMonths().filter(m=>!PARTIAL[m]);if(ms.length)state.mTo=ms[ms.length-1];}
function renderNav(){
  const n=state.alerts.filter(a=>a.lv!=="info"&&!a.ex).length;
  document.getElementById("nav").innerHTML=PAGES.map(p=>p.grp?`<div class="nav-label">${p.grp}</div>`:
    `<a href="#${p.id}" class="${state.page===p.id?'on':''}">${svg(p.ic)}${p.name}${p.tag?`<span class="tag">${p.tag}</span>`:""}${p.alerts&&n?`<span class="cnt">${n}</span>`:""}</a>`).join("");
}
function render(){
  state.page=(location.hash||"#geral").slice(1);
  if(!P[state.page])state.page="geral";
  const pg=PAGES.find(p=>p.id===state.page),r=R();
  state.alerts=buildAlerts(r);
  const sel=document.getElementById("selReport"),lbl=document.getElementById("selLbl");
  if(REAL_PAGES.includes(state.page)){
    const ms=allRealMonths(),cur=state.mTo&&ms.includes(state.mTo)?state.mTo:ms[ms.length-1];
    lbl.textContent="Período";sel.innerHTML=ms.slice().reverse().map(m=>{const r=monthRange(m);return`<option value="${m}" ${m===cur?"selected":""}>${r.name} · ${PARTIAL[m]?PARTIAL[m]+" (parcial)":r.range}</option>`}).join("");
    sel.onchange=e=>{state.mTo=e.target.value;state.metaMonth=null;render();};
    const rr=monthRange(cur);document.getElementById("pageTitle").innerHTML=`${pg.name}<small>${rr.name} · ${PARTIAL[cur]?PARTIAL[cur]+" (parcial)":rr.range} · vs mês anterior</small>`;
  }else{
    lbl.textContent="Período (exemplo)";sel.innerHTML=HISTORY.filter(h=>REPORTS[h.id]).map(h=>`<option value="${h.id}" ${h.id===state.report?"selected":""}>${h.label} · ${h.period}</option>`).join("");
    sel.onchange=e=>{state.report=e.target.value;render();};
    document.getElementById("pageTitle").innerHTML=`${pg.name}<small>${state.page==="concorrencia"?"Consulta "+(COMP.date||"—"):r.label+" · "+r.period}</small>`;
  }
  const db=document.getElementById("demoBar");
  const BANNER={concorrencia:`Dados reais · planilha de concorrência online (Google Sheets) · consulta de ${COMP.date||"—"} (não muda com o mês)`,criativos:"Aguardando dados · veja abaixo o que enviar",seo:"Dados reais · Google Analytics 4 (yallacar.com.br) via Supermetrics",fontes:"Status de cada fonte de dados do painel",comparar:"Compare quaisquer dois meses, dois intervalos de datas ou todos os meses lado a lado",diario:"Dados reais · gasto diário da Meta, Google e ChatGPT via Supermetrics · reservas do site pelo GA4",
    metas:"Realizado = dados reais · metas e orçamento editáveis (salvos neste navegador)",receita:"Contratos reais · premissas de receita editáveis",analise:"Resumo automático com dados reais · notas editáveis por mês",importar:"Importe os arquivos do mês ou lance canais sem exportação"};
  db.textContent=BANNER[state.page]||"Dados reais · Meta Ads, Google Ads, ChatGPT Ads, Yalla Digital, Chat Yalla e influenciadores";
  if(REAL_PAGES.includes(state.page)&&state.mTo&&PARTIAL[state.mTo])db.textContent=`Mês parcial (${PARTIAL[state.mTo]}) · mídia e site atualizados via Supermetrics · reservas, contratos, Chat Yalla e influenciadores de ${state.mTo} ainda não enviados — Aguardando arquivos`;
  {const PG_SRC={geral:["cmd","manual"],alertas:["cmd","manual"],metas:["manual"],mensal:["cmd","manual"],diario:["cmd"],comparar:["cmd","manual"],meta:["cmd"],google:["cmd"],gpt:["cmd"],campanhas:["cmd"],influencers:["manual"],seo:["cmd"],reservas:["manual"],receita:["manual"],funil:["manual"],produtos:["manual"],concorrencia:["auto"],analise:["cmd","manual"],historico:["cmd","manual"]}[state.page];
   let sb=document.getElementById("srcBadges");if(!sb){sb=document.createElement("span");sb.id="srcBadges";sb.style.cssText="display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle";db.after(sb);}
   sb.innerHTML=PG_SRC?PG_SRC.map(srcTag).join("")+`<a href="#fontes" style="color:var(--y);font-size:11px;margin-left:4px">fontes</a>`:"";}
  const waiting=/Aguardando/.test(db.textContent);db.style.background=waiting?"":"var(--green-soft)";db.style.color=waiting?"":"var(--green)";
  charts.forEach(c=>c.destroy());charts=[];if(chartIO)chartIO.disconnect();
  const vkey=[state.page,state.mTo,state.report,state.metaMonth,state.product,COMPARE].join("|");
  const changed=vkey!==state.vkey;ANIM=!REDUCED&&changed;state.vkey=vkey;
  const view=document.getElementById("view");view.innerHTML=P[state.page]();
  if(P[state.page+"_after"])P[state.page+"_after"]();
  drawSparks();attachHelp();renderNav();updPres();if(ANIM)introAnim(view);else view.classList.remove("anim");if(changed)window.scrollTo(0,0);
}
